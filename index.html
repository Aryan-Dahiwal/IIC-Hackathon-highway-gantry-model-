<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway Gantry Model</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        p {
            color: #9ca3af;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        a {
            display: block;
            padding: 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            background: #2563eb;
            color: white;
            transition: 0.2s;
        }

        a:hover {
            transform: translateY(-2px);
            opacity: 0.9;

        .without {
            background: #374151;
        }

</head>

<body>

    <div class="container">
        <h1>Highway Gantry Model</h1>

        <div class="buttons">
            <a href="model_WITH_speedcams.html">
                🚗 View Model with Speed Cameras
            </a>

            <a href="model_WITHOUT_speedcams.html" class="without">
